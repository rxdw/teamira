# Loads every *.json in /var/lib/grafana/dashboards (mounted from ./grafana/dashboards).
# Dashboards are read-only in the UI on purpose (allowUiUpdates: false) — to change one,
# edit it in Grafana, use "Export → Save to file", and replace the JSON in the repo, so
# what's deployed is always what's in git.
apiVersion: 1

providers:
  - name: seenly
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
