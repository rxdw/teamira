version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seenly
      POSTGRES_PASSWORD: seenly
      POSTGRES_DB: seenly
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seenly"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://seenly:seenly@db:5432/seenly
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Dashboards over the analytics tables — OPTIONAL, off unless asked for:
  #
  #   docker compose --profile analytics up -d metabase
  #
  # Bound to 127.0.0.1 on purpose: Metabase is a full SQL client, so it
  # must never be reachable from the internet. On a server, open it through
  # an SSH tunnel (ssh -L 3000:localhost:3000 user@server), then browse to
  # http://localhost:3000. Point it at the database with the READ-ONLY role
  # from docs/analytics.md, not the app's own login — that role can see the
  # analytics tables and nothing else (no users, no password hashes).
  # Its own settings live in the metabase_data volume (H2 file DB: fine for
  # one or two people; see docs/analytics.md before relying on it harder).
  metabase:
    image: metabase/metabase:latest
    profiles: ["analytics"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    ports:
      - "127.0.0.1:3000:3000"

  # Dashboards (graphs) over the analytics data — OPTIONAL, same profile as
  # metabase:
  #
  #   docker compose --profile analytics up -d grafana
  #
  # Ships with a ready dashboard ("Seenly — использование приложения", from
  # ./grafana/dashboards) and a datasource wired to the database through a
  # READ-ONLY role, so nothing has to be clicked together. Create the role
  # once (SQL in docs/analytics.md, section "Grafana"), put its password in
  # GRAFANA_DB_PASSWORD and pick GRAFANA_ADMIN_PASSWORD (both are read from
  # the .env next to this file; the fallbacks below are for a throwaway dev
  # machine only — the port is bound to 127.0.0.1, but still).
  #
  # Same rule as Metabase: 127.0.0.1 only, reached from outside through an SSH
  # tunnel (ssh -L 3001:localhost:3001 user@server), never through Caddy.
  # The outbound switches below stop Grafana phoning home / installing
  # plugins from grafana.com on its own — nothing here needs either.
  grafana:
    image: grafana/grafana-oss:latest
    profiles: ["analytics"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GRAFANA_DB_HOST: db:5432
      GRAFANA_DB_NAME: seenly
      GRAFANA_DB_USER: grafana_ro
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-change-me}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  db_data:
  metabase_data:
  grafana_data:
