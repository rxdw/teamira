name: Backend tests

# Only runs when something under backend/ actually changed — a
# mobile-only or docs-only PR shouldn't wait on this (or burn CI
# minutes on it) at all. Keep this list in sync with what actually
# affects the backend if new top-level files show up later.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres as a service container, not SQLite — see
    # backend/tests/README.md's own explanation: rate_limit.py's
    # INSERT ... ON CONFLICT ... RETURNING and migrate.py's advisory
    # locks are Postgres-specific, so anything lighter would quietly
    # test different behavior than what actually runs in production.
    # postgres:16-alpine matches docker-compose.yml's own db image.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamira_test
          POSTGRES_PASSWORD: teamira_test
          POSTGRES_DB: teamira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Matches what tests/conftest.py hardcodes and expects to find —
      # see tests/README.md's "One-time setup". The service container
      # above creates this role/db directly via its own POSTGRES_*
      # vars, which is the CI equivalent of the `CREATE USER`/`CREATE
      # DATABASE` commands a human runs locally.
      DATABASE_URL: postgresql+psycopg2://teamira_test:teamira_test@localhost:5432/teamira_test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v
