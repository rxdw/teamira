<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Seenly Auto-Tracking</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        width: 280px;
        padding: 14px;
        color: #222;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      p {
        font-size: 11px;
        color: #666;
        line-height: 1.4;
        margin: 0 0 12px;
      }
      label {
        font-size: 11px;
        color: #444;
        display: block;
        margin-bottom: 3px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 12px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: #222;
        color: #fff;
        font-size: 12px;
        cursor: pointer;
      }
      #status {
        margin-top: 8px;
        font-size: 11px;
        text-align: center;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Seenly Auto-Tracking</h1>
    <p>
      Paste the server address and token from Seenly →
      Settings → auto-tracking (the same pair used for Plex/Jellyfin/Kodi).
    </p>
    <label for="server">server</label>
    <input id="server" placeholder="https://your-seenly-server.com" />
    <label for="token">token</label>
    <input id="token" placeholder="paste your token" />
    <button id="save">save</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
